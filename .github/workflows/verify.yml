name: Arix Crawler CI

on:
  push:
  pull_request:

jobs:
  javascript:
    name: JavaScript and UI checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run build

  rust:
    name: Rust extractor checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo test --bin arix-extract
      - run: cargo check --bin arix-extract
      - run: cargo build --release --bin arix-extract
