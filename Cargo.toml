[package]
name = "arix-crawler-extractor"
version = "4.0.0"
edition = "2024"
publish = false

[[bin]]
name = "arix-extract"
path = "api/extract.rs"

[dependencies]
anyhow = "1"
futures-util = "0.3"
http = "1"
http-body-util = "0.1"
pdf-extract = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "gzip", "brotli", "deflate", "zstd", "charset", "json", "stream"] }
scraper = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "sync"] }
url = "2"
vercel_runtime = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3
